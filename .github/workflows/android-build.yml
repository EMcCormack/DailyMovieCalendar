name: Build Android with EAS

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify EAS project is linked
        run: |
          node -e 'const id = require("./app.json").expo?.extra?.eas?.projectId; if (!id) throw new Error("Run eas init locally and commit app.json before CI builds.")'
      - name: Queue EAS Android APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          EAS_CLI_VERSION="$(node -p 'require("./eas.json").cli.version')"
          pnpm dlx \
            --allow-build=dtrace-provider \
            --allow-build=protobufjs \
            "eas-cli@$EAS_CLI_VERSION" \
            build --platform android --profile preview --non-interactive --no-wait
